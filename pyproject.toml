[project]
name = "anyio-cysqlite"
dynamic = ["version"]
description = "a anyio and cysqlite library"
readme = "README.md"
authors = [
    { name = "Vizonex", email = "VizonexBusiness@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.16.0",
    "cysqlite>=0.4.1",
]


[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "anyio_cysqlite.__version__"}

[build-system]
requires = ["setuptools"]


[project.urls]
    repository = "https://github.com/Vizonex/anyio-cysqlite.git"


[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "I",
    "E",
    "RUF",
    "UP"
]
ignore = [
    "F405",
]
